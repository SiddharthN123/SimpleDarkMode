<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      text-align: center;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .toggle-container {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }

    .toggle-container input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="orange" stroke="none"><circle cx="12" cy="12" r="5" /></svg>'); 
      background-size: 80%;
      background-repeat: no-repeat;
      background-position: center;
    }

    input:checked + .slider {
      background-color: #2196F3;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
      background-color: #222;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" stroke="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>');
    }

    .status {
      margin-top: 15px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h3>Dark Mode</h3>
  
  <label class="toggle-container">
    <input type="checkbox" id="darkToggle">
    <span class="slider"></span>
  </label>

  <div class="status" id="statusText">Off</div>

  <script src="popup.js"></script>
</body>
</html>
